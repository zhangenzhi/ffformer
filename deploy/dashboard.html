<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ForestFormer3D Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root {
  --bg: #0d1117; --bg2: #161b22; --bg3: #21262d;
  --border: #30363d; --text: #c9d1d9; --text2: #8b949e;
  --accent: #58a6ff; --green: #3fb950; --red: #f85149;
  --orange: #d29922; --radius: 8px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif;
  height:100vh; display:flex; flex-direction:column; overflow:hidden; }

/* Header */
header { height:48px; background:var(--bg2); border-bottom:1px solid var(--border);
  display:flex; align-items:center; padding:0 20px; gap:16px; flex-shrink:0; }
header .logo { font-size:16px; font-weight:700; color:#e6edf3; letter-spacing:0.3px; }
header .logo span { color:var(--green); }
header .status { margin-left:auto; font-size:12px; color:var(--text2); }
header .dot { width:8px; height:8px; border-radius:50%; display:inline-block;
  margin-right:4px; vertical-align:middle; }
header .dot.on { background:var(--green); }
header .dot.off { background:var(--red); }
header .dot.busy { background:var(--orange); animation:pulse 1.5s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

/* Layout */
.main { flex:1; display:flex; overflow:hidden; }

/* Sidebar */
.sidebar { width:340px; background:var(--bg2); border-right:1px solid var(--border);
  display:flex; flex-direction:column; flex-shrink:0; }

/* Upload zone */
.upload-zone { padding:16px; border-bottom:1px solid var(--border); }
.drop-area { border:2px dashed var(--border); border-radius:var(--radius);
  padding:24px 16px; text-align:center; cursor:pointer; transition:all 0.2s; }
.drop-area:hover, .drop-area.dragover { border-color:var(--accent);
  background:rgba(88,166,255,0.05); }
.drop-area .icon { font-size:32px; margin-bottom:8px; }
.drop-area p { font-size:13px; color:var(--text2); }
.drop-area .formats { font-size:11px; color:var(--text2); margin-top:4px; }
.upload-params { margin-top:12px; display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.upload-params label { font-size:10px; color:var(--text2); text-transform:uppercase;
  letter-spacing:0.5px; display:block; margin-bottom:2px; }
.upload-params input { width:100%; background:var(--bg); color:var(--text);
  border:1px solid var(--border); border-radius:4px; padding:4px 8px; font-size:12px; }
.upload-params input:focus { border-color:var(--accent); outline:none; }
.btn { display:block; width:100%; padding:8px; border:none; border-radius:6px;
  font-size:13px; font-weight:600; cursor:pointer; margin-top:10px; transition:all 0.15s; }
.btn-primary { background:var(--green); color:#fff; }
.btn-primary:hover { background:#2ea043; }
.btn-primary:disabled { background:var(--bg3); color:var(--text2); cursor:not-allowed; }

/* Progress: segmented stage bars */
.progress-container { margin-top:10px; display:none; }
.progress-container.show { display:block; }
.progress-header { font-size:11px; color:var(--accent); margin-bottom:6px;
  display:flex; justify-content:space-between; align-items:center; }
.progress-header .elapsed { color:var(--text2); font-size:10px; }
.progress-stages { display:flex; flex-direction:column; gap:4px; }
.stage { display:grid; grid-template-columns:70px 1fr 46px; gap:6px; align-items:center;
  font-size:10px; height:16px; }
.stage-name { color:var(--text2); font-weight:600; white-space:nowrap; overflow:hidden; }
.stage.active .stage-name { color:var(--accent); }
.stage.done .stage-name { color:var(--green); }
.stage-bar { height:4px; background:var(--bg3); border-radius:2px; overflow:hidden; }
.stage-bar-fill { height:100%; border-radius:2px; transition:width 0.4s ease; }
.stage.pending .stage-bar-fill { width:0; background:var(--bg3); }
.stage.active .stage-bar-fill { background:var(--accent); }
.stage.done .stage-bar-fill { width:100%!important; background:var(--green); }
.stage-time { color:var(--text2); font-size:9px; text-align:right; font-variant-numeric:tabular-nums; }
.stage.active .stage-time { color:var(--accent); }
.stage.done .stage-time { color:var(--green); }
@keyframes stagePulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
.stage.active .stage-bar-fill { animation:stagePulse 1.5s ease-in-out infinite; }

/* Sidebar tabs */
.sidebar-tabs { display:flex; border-bottom:1px solid var(--border); }
.sidebar-tabs button { flex:1; background:none; border:none; color:var(--text2);
  padding:8px; font-size:11px; font-weight:600; cursor:pointer; text-transform:uppercase;
  letter-spacing:0.5px; border-bottom:2px solid transparent; transition:all 0.15s; }
.sidebar-tabs button.active { color:var(--accent); border-bottom-color:var(--accent); }
.sidebar-tabs button:hover { color:var(--text); }

/* Task list */
.task-list { flex:1; overflow-y:auto; padding:8px; display:none; }
.task-list.show { display:block; }
.task-list h3 { font-size:11px; color:var(--text2); text-transform:uppercase;
  letter-spacing:0.8px; padding:8px; }
.task-card { background:var(--bg); border:1px solid var(--border); border-radius:var(--radius);
  padding:12px; margin-bottom:8px; cursor:pointer; transition:all 0.15s; position:relative; }
.task-card:hover { border-color:var(--accent); }
.task-card.active { border-color:var(--accent); background:rgba(88,166,255,0.06); }
.task-card .name { font-size:13px; font-weight:600; margin-bottom:4px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding-right:24px; }
.task-card .meta { font-size:11px; color:var(--text2); display:flex; gap:8px; align-items:center; }
.task-card .delete-btn { position:absolute; top:8px; right:8px; background:none; border:none;
  color:var(--text2); cursor:pointer; font-size:14px; padding:2px 4px; border-radius:3px;
  opacity:0; transition:all 0.15s; line-height:1; }
.task-card:hover .delete-btn { opacity:1; }
.task-card .delete-btn:hover { color:var(--red); background:rgba(248,81,73,0.1); }
.badge { padding:1px 6px; border-radius:10px; font-size:10px; font-weight:600; }
.badge.completed { background:rgba(63,185,80,0.15); color:var(--green); }
.badge.processing { background:rgba(210,153,34,0.15); color:var(--orange); }
.badge.failed { background:rgba(248,81,73,0.15); color:var(--red); }
.task-stats { margin-top:8px; font-size:11px; color:var(--text2);
  display:grid; grid-template-columns:1fr 1fr; gap:2px 12px; }
.task-stats .val { color:var(--text); font-weight:600; }
.tile-grid { margin-top:8px; display:grid; grid-template-columns:repeat(auto-fill, minmax(100px, 1fr)); gap:4px; }
.tile-cell { font-size:9px; padding:4px 6px; border-radius:3px; background:var(--bg3);
  border:1px solid var(--border); line-height:1.4; }
.tile-cell.done { border-color:var(--green); background:rgba(63,185,80,0.08); }
.tile-cell.running { border-color:var(--accent); background:rgba(88,166,255,0.08);
  animation:stagePulse 1.5s ease-in-out infinite; }
.tile-cell.failed { border-color:var(--red); background:rgba(248,81,73,0.08); }
.tile-cell .tile-head { font-weight:700; color:var(--text); }
.tile-cell.done .tile-head { color:var(--green); }
.tile-cell.running .tile-head { color:var(--accent); }
.tile-cell .tile-detail { color:var(--text2); }

/* Files panel */
.files-panel { flex:1; overflow-y:auto; padding:8px; display:none; }
.files-panel.show { display:block; }
.file-item { background:var(--bg); border:1px solid var(--border); border-radius:var(--radius);
  padding:10px 12px; margin-bottom:6px; display:flex; align-items:center; gap:10px; }
.file-item .file-icon { font-size:16px; flex-shrink:0; }
.file-item .file-info { flex:1; min-width:0; }
.file-item .file-name { font-size:12px; font-weight:600; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis; }
.file-item .file-meta { font-size:10px; color:var(--text2); margin-top:2px; }
.file-item .file-actions { display:flex; gap:4px; flex-shrink:0; }
.file-item .file-actions button, .file-item .file-actions a {
  background:var(--bg3); border:1px solid var(--border); color:var(--text2);
  padding:3px 8px; border-radius:4px; font-size:10px; cursor:pointer;
  text-decoration:none; transition:all 0.15s; display:inline-block; }
.file-item .file-actions button:hover, .file-item .file-actions a:hover {
  border-color:var(--accent); color:var(--accent); }
.file-item .file-actions .del-btn:hover { border-color:var(--red); color:var(--red); }
.files-empty { text-align:center; color:var(--text2); font-size:12px; padding:24px; }

/* Viewer */
.viewer { flex:1; position:relative; background:var(--bg); }
.viewer canvas { display:block; width:100%!important; height:100%!important; }
.viewer-empty { position:absolute; inset:0; display:flex; align-items:center;
  justify-content:center; flex-direction:column; gap:12px; color:var(--text2); }
.viewer-empty .big { font-size:48px; }
.viewer-empty p { font-size:14px; }

/* Viewer toolbar */
.viewer-toolbar { position:absolute; top:10px; right:10px; z-index:20;
  background:rgba(22,27,34,0.92); backdrop-filter:blur(6px);
  border:1px solid var(--border); border-radius:var(--radius);
  padding:10px 12px; font-size:11px; width:150px; }
.viewer-toolbar label { display:block; margin:5px 0 2px; color:var(--text2);
  font-size:9px; text-transform:uppercase; letter-spacing:0.5px; }
.viewer-toolbar input[type=range] { width:100%; accent-color:var(--accent); }
.viewer-toolbar select { width:100%; background:var(--bg); color:var(--text);
  border:1px solid var(--border); border-radius:4px; padding:2px 4px; font-size:11px; }

/* Info bar */
.info-bar { position:absolute; bottom:10px; left:10px; right:10px;
  background:rgba(22,27,34,0.88); border:1px solid var(--border);
  border-radius:6px; padding:6px 14px; font-size:11px; color:var(--text2);
  display:flex; gap:16px; align-items:center; }
.info-bar .sep { color:var(--border); }

/* Hardware panel */
.hw-panel { position:absolute; left:10px; top:10px; z-index:15;
  background:rgba(22,27,34,0.92); backdrop-filter:blur(6px);
  border:1px solid var(--border); border-radius:var(--radius);
  padding:8px 12px; font-size:10px; max-width:240px; min-width:200px; }
.hw-title { font-size:9px; text-transform:uppercase; letter-spacing:0.8px;
  color:var(--text2); margin-bottom:4px; font-weight:600; }
.hw-content { color:var(--text); line-height:1.6; }
.hw-content .hw-row { display:flex; justify-content:space-between; gap:8px; }
.hw-content .hw-label { color:var(--text2); }
.hw-content .hw-val { font-weight:600; text-align:right; }
.hw-gpu { color:var(--green); font-weight:700; }
.hw-nogpu { color:var(--red); }
.hw-section { margin-top:5px; padding-top:5px; border-top:1px solid rgba(255,255,255,0.06); }
.hw-section-title { font-size:8px; text-transform:uppercase; letter-spacing:0.6px;
  color:var(--text2); margin-bottom:3px; opacity:0.7; }
.hw-bar { height:4px; background:var(--bg); border-radius:2px; margin:2px 0 4px; overflow:hidden; }
.hw-bar-fill { height:100%; border-radius:2px; transition:width 0.6s ease; }
.hw-bar-fill.green { background:var(--green); }
.hw-bar-fill.orange { background:var(--orange); }
.hw-bar-fill.red { background:var(--red); }
.hw-bar-row { display:flex; justify-content:space-between; font-size:9px; }
.hw-bar-row .hw-label { color:var(--text2); }
.hw-bar-row .hw-val { font-weight:600; }

/* Download buttons */
.downloads { padding:12px 16px; border-top:1px solid var(--border); }
.downloads .btn { margin-top:0; margin-bottom:6px; font-size:12px; padding:6px;
  text-align:center; text-decoration:none; display:block; }
.btn-secondary { background:var(--bg3); color:var(--text); border:1px solid var(--border); }
.btn-secondary:hover { border-color:var(--accent); color:var(--accent); }

/* Config panel */
.config-panel { padding:12px 16px; border-bottom:1px solid var(--border); }
.config-panel h4 { font-size:10px; color:var(--text2); text-transform:uppercase;
  letter-spacing:0.6px; margin-bottom:8px; }
.config-row { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
.config-row select { flex:1; background:var(--bg); color:var(--text);
  border:1px solid var(--border); border-radius:4px; padding:4px 6px; font-size:11px; }
.config-row select:focus { border-color:var(--accent); outline:none; }
.config-row .btn-sm { padding:4px 10px; border:1px solid var(--border); border-radius:4px;
  background:var(--bg3); color:var(--text); font-size:10px; font-weight:600;
  cursor:pointer; transition:all 0.15s; white-space:nowrap; }
.config-row .btn-sm:hover { border-color:var(--accent); color:var(--accent); }
.config-meta { font-size:10px; color:var(--text2); }

/* Data browser panel */
.data-panel { flex:1; overflow-y:auto; padding:8px; display:none; }
.data-panel.show { display:block; }
.data-item { background:var(--bg); border:1px solid var(--border); border-radius:var(--radius);
  padding:10px 12px; margin-bottom:6px; display:flex; align-items:center; gap:10px; }
.data-item .data-icon { font-size:16px; flex-shrink:0; }
.data-item .data-info { flex:1; min-width:0; }
.data-item .data-name { font-size:12px; font-weight:600; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis; }
.data-item .data-meta { font-size:10px; color:var(--text2); margin-top:2px; }
.data-item .btn-run { padding:3px 10px; border:1px solid var(--green); border-radius:4px;
  background:rgba(63,185,80,0.1); color:var(--green); font-size:10px; font-weight:600;
  cursor:pointer; transition:all 0.15s; flex-shrink:0; }
.data-item .btn-run:hover { background:var(--green); color:#fff; }

/* Log viewer modal */
.log-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:100;
  display:flex; align-items:center; justify-content:center; }
.log-overlay.hidden { display:none; }
.log-modal { background:var(--bg); border:1px solid var(--border); border-radius:var(--radius);
  width:560px; max-width:90vw; max-height:70vh; display:flex; flex-direction:column; }
.log-modal-header { display:flex; align-items:center; justify-content:space-between;
  padding:12px 16px; border-bottom:1px solid var(--border); }
.log-modal-header h3 { font-size:13px; color:var(--text); }
.log-modal-header .close-btn { background:none; border:none; color:var(--text2);
  font-size:18px; cursor:pointer; padding:2px 6px; border-radius:4px; }
.log-modal-header .close-btn:hover { color:var(--text); background:var(--bg3); }
.log-content { flex:1; overflow-y:auto; padding:12px 16px; background:#0a0e14;
  font-family:'Cascadia Code','Fira Code','Consolas',monospace; font-size:12px;
  line-height:1.7; color:#a0c4a8; white-space:pre-wrap; word-break:break-all; }

/* View Log button */
.btn-log { padding:2px 8px; border:1px solid var(--border); border-radius:4px;
  background:var(--bg3); color:var(--text2); font-size:10px; cursor:pointer;
  transition:all 0.15s; margin-left:6px; }
.btn-log:hover { border-color:var(--accent); color:var(--accent); }

/* Outputs grouping in files panel */
.output-group { margin-bottom:12px; }
.output-group-header { font-size:11px; color:var(--text2); padding:6px 8px;
  display:flex; align-items:center; gap:8px; }
.output-group-header .val { color:var(--text); font-weight:600; }

/* Scrollbar */
::-webkit-scrollbar { width:6px; }
::-webkit-scrollbar-track { background:var(--bg2); }
::-webkit-scrollbar-thumb { background:var(--bg3); border-radius:3px; }
::-webkit-scrollbar-thumb:hover { background:#444; }
</style>
</head>
<body>

<header>
  <div class="logo">Forest<span>Former3D</span></div>
  <div class="status" id="serverStatus">
    <span class="dot off" id="statusDot"></span>
    <span id="statusText">Connecting...</span>
  </div>
</header>

<div class="main">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="config-panel">
      <h4>Model</h4>
      <div class="config-row">
        <select id="modelSelect"><option value="">Loading...</option></select>
        <button class="btn-sm" id="modelChangeBtn" onclick="switchModel()">Change</button>
      </div>
      <div class="config-meta" id="modelMeta"></div>
    </div>
    <div class="upload-zone">
      <div class="drop-area" id="dropArea">
        <div class="icon">&#x1F332;</div>
        <p>Drop LAS / PLY file here</p>
        <div class="formats">or click to browse</div>
      </div>
      <input type="file" id="fileInput" accept=".las,.laz,.ply" hidden>
      <div class="upload-params">
        <div>
          <label>Voxel Size (m)</label>
          <input type="number" id="paramSubsample" value="0.05" step="0.01" min="0">
        </div>
        <div>
          <label>Tile Size (m)</label>
          <input type="number" id="paramTileSize" value="30" step="5" min="10">
        </div>
      </div>
      <button class="btn btn-primary" id="uploadBtn" disabled>Upload & Process</button>
      <div class="progress-container" id="progressContainer">
        <div class="progress-header">
          <span id="progressLabel">Uploading...</span>
          <span class="elapsed" id="progressElapsed">0.0s</span>
        </div>
        <div class="progress-detail" id="progressDetail" style="font-size:10px;color:#8b949e;margin:0 0 6px;text-align:center;display:none"></div>
        <div class="progress-stages" id="progressStages"></div>
      </div>
    </div>

    <div class="sidebar-tabs">
      <button class="active" id="tabResults" onclick="switchTab('results')">Results</button>
      <button id="tabData" onclick="switchTab('data')">Data</button>
      <button id="tabFiles" onclick="switchTab('files')">Files</button>
    </div>

    <div class="task-list show" id="taskList">
      <h3>Results</h3>
    </div>

    <div class="data-panel" id="dataPanel">
      <div class="files-empty">Scanning for data files...</div>
    </div>

    <div class="files-panel" id="filesPanel">
      <div class="files-empty">No files yet</div>
    </div>

    <div class="downloads" id="downloads" style="display:none">
      <a class="btn btn-secondary" id="dlPly" href="#" download>Download PLY</a>
      <a class="btn btn-secondary" id="dlJson" href="#" target="_blank">View Stats JSON</a>
    </div>
  </div>

  <!-- 3D Viewer -->
  <div class="viewer" id="viewerPanel">
    <div class="viewer-empty" id="viewerEmpty">
      <div class="big">&#x1F333;</div>
      <p>Upload a point cloud to see results</p>
    </div>
    <canvas id="viewer3d" style="display:none"></canvas>

    <div class="viewer-toolbar" id="viewerToolbar" style="display:none">
      <label>Point Size</label>
      <input type="range" id="vPsize" min="3" max="80" value="30">
      <label>Background</label>
      <select id="vBg">
        <option value="#161b22">Dark</option>
        <option value="#ffffff">White</option>
        <option value="#000000">Black</option>
      </select>
      <label>Color Mode</label>
      <select id="vColorMode">
        <option value="instance">Instance</option>
        <option value="semantic">Semantic</option>
      </select>
    </div>

    <div class="info-bar" id="infoBar" style="display:none">
      <span id="infoTrees"></span>
      <span class="sep">|</span>
      <span id="infoPoints"></span>
      <span class="sep">|</span>
      <span id="infoTime"></span>
    </div>

    <!-- Hardware spec panel -->
    <div class="hw-panel" id="hwPanel">
      <div class="hw-title">Hardware</div>
      <div class="hw-content" id="hwContent">Loading...</div>
    </div>
  </div>
</div>

<!-- Log Viewer Modal -->
<div class="log-overlay hidden" id="logOverlay" onclick="if(event.target===this)closeLog()">
  <div class="log-modal">
    <div class="log-modal-header">
      <h3 id="logTitle">Inference Log</h3>
      <button class="close-btn" onclick="closeLog()">X</button>
    </div>
    <div class="log-content" id="logContent">No log available.</div>
  </div>
</div>

<script>
// ==================== CONFIG ====================
const API = window.location.origin;

// ==================== COLORS ====================
const INST_COLORS = [
  [228,26,28],[55,126,184],[77,175,74],[152,78,163],[255,127,0],
  [255,255,51],[166,86,40],[247,129,191],[153,153,153],[102,194,165],
  [252,141,98],[141,160,203],[231,41,138],[34,139,34],[210,180,140],
  [0,191,255],[221,160,221],[127,255,0],[255,215,0],[70,130,180],
  [240,128,128],[176,224,230],[205,133,63],[188,189,34],[148,0,211],
  [0,206,209],
];
const SEM_COLORS = {0:[139,119,101], 1:[210,150,60], 2:[34,180,34]};
const UNASSIGNED = [60,60,60];

// ==================== STATE ====================
let selectedFile = null;
let activeTaskId = null;
let taskData = {};
let scene, camera, renderer, pointsMesh, pointsMat;
let spherical = {theta:-Math.PI/2, phi:Math.PI/3, radius:10};
let camTarget = new THREE.Vector3(0,0,0);
let isDrag=false, isPan=false, lx=0, ly=0;
let currentPlyData = null;
let R = 1;
let pollingTimers = {};  // task_id -> interval id
let loadedTiles = {};    // task_id -> number of tiles already rendered in viewer
let tileMeshes = [];     // THREE.Points meshes for progressive tile rendering
let currentTab = 'results';

// ==================== UPLOAD ====================
const dropArea = document.getElementById('dropArea');
const fileInput = document.getElementById('fileInput');
const uploadBtn = document.getElementById('uploadBtn');
const progressContainer = document.getElementById('progressContainer');
const progressLabel = document.getElementById('progressLabel');
const progressElapsed = document.getElementById('progressElapsed');

dropArea.addEventListener('click', () => fileInput.click());

function selectFile(f) {
  const ext = f.name.split('.').pop().toLowerCase();
  if (!['las','laz','ply'].includes(ext)) { alert('Unsupported format. Use .las/.laz/.ply'); return; }
  selectedFile = f;
  dropArea.querySelector('p').textContent = f.name;
  dropArea.querySelector('.formats').textContent = `${(f.size/1e6).toFixed(1)} MB`;
  uploadBtn.disabled = false;
}

// Step order for progress tracking
// Visible pipeline stages (order matters)
const VISIBLE_STAGES = [
  {key:'reading',     label:'Read'},
  {key:'subsampling', label:'Subsample'},
  {key:'splitting',   label:'Split'},
  {key:'inferring',   label:'Infer'},
  {key:'merging',     label:'Merge'},
  {key:'saving',      label:'Save'},
  {key:'tiling',      label:'Tiles'},
];

function fmtDuration(sec) {
  if (sec == null) return '';
  if (sec < 60) return sec.toFixed(1) + 's';
  const m = Math.floor(sec / 60);
  const s = (sec % 60).toFixed(0);
  return `${m}m${s}s`;
}

function updateProgressUI(data) {
  const step = data.step || 'uploading';
  const elapsed = data.elapsed || 0;
  const stats = data.stats || {};
  const stepTimes = data.step_times || {};
  const now = Date.now() / 1000;

  // Header label
  let label = data.step_label || step;
  if (step === 'inferring' && stats.n_tiles > 1) {
    label = `Inferring tile ${stats.current_tile||'?'}/${stats.n_tiles}`;
  }
  progressLabel.textContent = label;
  progressElapsed.textContent = fmtDuration(elapsed);

  // Detail line
  const detail = document.getElementById('progressDetail');
  let detailText = '';
  if (step === 'inferring' && stats.n_tiles > 1) {
    detailText = `${(stats.tile_points||0).toLocaleString()} pts`;
    if (elapsed > 0 && data.progress > 0 && data.progress < 100) {
      const eta = (elapsed / data.progress * (100 - data.progress));
      detailText += ` · ETA ~${fmtDuration(eta)}`;
    }
  } else if (step === 'completed') {
    detailText = `${stats.n_trees||0} trees · ${(stats.n_processed||0).toLocaleString()} pts`;
  }
  detail.textContent = detailText;
  detail.style.display = detailText ? 'block' : 'none';

  // Build stage bars
  const container = document.getElementById('progressStages');
  const stageOrder = VISIBLE_STAGES.map(s => s.key);
  const currentIdx = stageOrder.indexOf(step);

  let html = '';
  for (let i = 0; i < VISIBLE_STAGES.length; i++) {
    const s = VISIBLE_STAGES[i];
    const st = stepTimes[s.key];
    let state, barPct, timeStr;

    if (step === 'completed' || i < currentIdx) {
      // Done
      state = 'done';
      barPct = 100;
      timeStr = st ? fmtDuration(st.duration) : '';
    } else if (i === currentIdx) {
      // Active
      state = 'active';
      if (s.key === 'inferring' && stats.n_tiles > 1) {
        barPct = Math.round(((stats.current_tile || 1) - 1) / stats.n_tiles * 100);
      } else {
        barPct = 50; // indeterminate-ish for active non-tile stages
      }
      // Live elapsed for active step
      timeStr = st ? fmtDuration(now - st.start) : '';
    } else {
      // Pending
      state = 'pending';
      barPct = 0;
      timeStr = '';
    }

    // Infer stage: show tile sub-label
    let nameLabel = s.label;
    if (s.key === 'inferring' && stats.n_tiles > 1 && state === 'active') {
      nameLabel = `Infer ${stats.current_tile||'?'}/${stats.n_tiles}`;
    }

    html += `<div class="stage ${state}">
      <div class="stage-name">${nameLabel}</div>
      <div class="stage-bar"><div class="stage-bar-fill" style="width:${barPct}%"></div></div>
      <div class="stage-time">${timeStr}</div>
    </div>`;
  }
  container.innerHTML = html;
}

function startPolling(taskId) {
  // Clear any existing polling for this task
  if (pollingTimers[taskId]) clearInterval(pollingTimers[taskId]);

  pollingTimers[taskId] = setInterval(async () => {
    try {
      const resp = await fetch(`${API}/task/${taskId}/status`, {signal: AbortSignal.timeout(30000)});
      const data = await resp.json();

      // Update task data
      taskData[taskId] = {
        ...taskData[taskId],
        ...data,
        task_id: taskId,
      };

      // Update progress UI if this is the currently uploading task
      if (progressContainer.classList.contains('show') && progressContainer.dataset.taskId === taskId) {
        updateProgressUI(data);
      }

      renderTaskList();

      // Update hardware panel from task poll data when health check may be slow
      if (data.hw) {
        updateHardwareFromPoll(data.hw);
      }

      // Progressive tile rendering: load new tiles as they complete
      if (data.completed_tiles && data.completed_tiles > (loadedTiles[taskId] || 0)) {
        const from = loadedTiles[taskId] || 0;
        for (let t = from; t < data.completed_tiles; t++) {
          loadTilePreview(taskId, t);
        }
        loadedTiles[taskId] = data.completed_tiles;
      }

      if (data.status === 'completed') {
        clearInterval(pollingTimers[taskId]);
        delete pollingTimers[taskId];

        // Hide progress, re-enable upload
        setTimeout(() => {
          progressContainer.classList.remove('show');
          uploadBtn.disabled = false;
        }, 600);

        // Auto-select completed task
        selectTask(taskId);
        refreshFiles();
      } else if (data.status === 'failed') {
        clearInterval(pollingTimers[taskId]);
        delete pollingTimers[taskId];

        progressContainer.classList.remove('show');
        uploadBtn.disabled = false;
        alert('Processing failed: ' + (data.error || 'Unknown error'));
      }
    } catch (e) {
      console.warn('Polling timeout (server busy), will retry...', e.message);
    }
  }, 3000);
}

uploadBtn.addEventListener('click', async () => {
  if (!selectedFile) return;
  uploadBtn.disabled = true;
  clearTileMeshes();
  loadedTiles = {};

  // Show progress immediately
  progressContainer.classList.add('show');
  progressLabel.textContent = 'Uploading...';
  progressElapsed.textContent = '0.0s';
  document.getElementById('progressStages').innerHTML = '';
  document.getElementById('progressDetail').style.display = 'none';

  const formData = new FormData();
  formData.append('file', selectedFile);
  const sub = document.getElementById('paramSubsample').value;
  const tileSize = document.getElementById('paramTileSize').value;
  const fileSize = selectedFile.size;
  const uploadStart = Date.now();

  try {
    // Use XMLHttpRequest for upload progress
    const resp = await new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open('POST', `${API}/predict?subsample=${sub}&tile_size=${tileSize}`);
      xhr.upload.onprogress = (e) => {
        if (e.lengthComputable) {
          const elapsed = (Date.now() - uploadStart) / 1000;
          const speed = e.loaded / elapsed;
          const eta = (e.total - e.loaded) / speed;
          const pct = Math.round(e.loaded / e.total * 100);
          progressElapsed.textContent = elapsed.toFixed(1) + 's';
          // Show upload as a stage
          document.getElementById('progressStages').innerHTML = `<div class="stage active">
            <div class="stage-name">Upload</div>
            <div class="stage-bar"><div class="stage-bar-fill" style="width:${pct}%"></div></div>
            <div class="stage-time">${(speed/1e6).toFixed(1)} MB/s</div>
          </div>`;
          const detail = document.getElementById('progressDetail');
          detail.textContent = `${(e.loaded/1e6).toFixed(0)}/${(e.total/1e6).toFixed(0)} MB · ETA ${eta.toFixed(0)}s`;
          detail.style.display = 'block';
        }
      };
      xhr.onload = () => {
        if (xhr.status >= 200 && xhr.status < 300) {
          resolve({ok: true, json: () => JSON.parse(xhr.responseText)});
        } else {
          resolve({ok: false, json: () => JSON.parse(xhr.responseText)});
        }
      };
      xhr.onerror = () => reject(new Error('Upload failed'));
      xhr.send(formData);
    });
    const data = await resp.json();

    if (resp.ok) {
      const taskId = data.task_id;
      taskData[taskId] = {
        task_id: taskId,
        status: 'processing',
        filename: selectedFile.name,
        step: 'uploading',
        step_label: 'Processing...',
        progress: 5,
      };
      progressContainer.dataset.taskId = taskId;
      renderTaskList();

      // Start polling for progress
      startPolling(taskId);
    } else {
      progressContainer.classList.remove('show');
      uploadBtn.disabled = false;
      alert('Error: ' + (data.detail || JSON.stringify(data)));
    }
  } catch (e) {
    progressContainer.classList.remove('show');
    uploadBtn.disabled = false;
    alert('Request failed: ' + e.message);
  }
});

  document.getElementById('tabFiles').classList.toggle('active', tab === 'files');

// ==================== FILES PANEL ====================
function formatFileSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1048576).toFixed(1) + ' MB';
}

function formatTime(ts) {
  const d = new Date(ts * 1000);
  return d.toLocaleString(undefined, {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'});
}

async function refreshFiles() {
  try {
    const resp = await fetch(`${API}/files`);
    const files = await resp.json();
    const panel = document.getElementById('filesPanel');

    if (!files.length) {
      panel.innerHTML = '<div class="files-empty">No files yet</div>';
      return;
    }

    let html = '';
    for (const f of files) {
      const icon = f.type === 'result' ? '&#x1F4CA;' : '&#x1F4C1;';
      const displayName = f.type === 'result'
        ? `${f.task_id} / ${f.filename}`
        : (f.original_name || f.filename);
      const badge = f.status === 'completed'
        ? '<span class="badge completed" style="margin-left:6px">done</span>'
        : f.status === 'processing'
          ? '<span class="badge processing" style="margin-left:6px">running</span>'
          : '';

      html += `<div class="file-item">
        <div class="file-icon">${icon}</div>
        <div class="file-info">
          <div class="file-name">${displayName}${badge}</div>
          <div class="file-meta">${formatFileSize(f.size)} &middot; ${formatTime(f.modified)}</div>
        </div>
        <div class="file-actions">
          ${f.download_url ? `<a href="${API}${f.download_url}" download title="Download">DL</a>` : ''}
          <button class="del-btn" onclick="deleteTask('${f.task_id}')" title="Delete task">X</button>
        </div>
      </div>`;
    }
    panel.innerHTML = html;
  } catch (e) {
    console.error('Failed to refresh files:', e);
  }
}

async function deleteTask(taskId) {
  if (!confirm(`Delete task ${taskId} and all its files?`)) return;
  try {
    const resp = await fetch(`${API}/task/${taskId}`, {method: 'DELETE'});
    if (resp.ok) {
      delete taskData[taskId];
      if (activeTaskId === taskId) {
        activeTaskId = null;
        document.getElementById('downloads').style.display = 'none';
      }
      renderTaskList();
      refreshFiles();
    } else {
      const data = await resp.json();
      alert('Delete failed: ' + (data.detail || 'Unknown error'));
    }
  } catch (e) {
    alert('Delete failed: ' + e.message);
  }
}

// ==================== TASK LIST ====================
function renderTileGrid(tileInfo) {
  if (!tileInfo || tileInfo.length === 0) return '';
  let html = '<div class="tile-grid">';
  for (let i = 0; i < tileInfo.length; i++) {
    const ti = tileInfo[i];
    const st = ti.status || 'pending';
    let detail = '';
    if (st === 'done') {
      detail = `${(ti.n_trees||0)} trees · ${ti.time}s`;
    } else if (st === 'running') {
      detail = `${(ti.n_points||0).toLocaleString()} pts`;
    } else if (st === 'failed') {
      detail = 'failed';
    }
    html += `<div class="tile-cell ${st}">
      <div class="tile-head">Tile ${i+1}</div>
      <div class="tile-detail">${detail}</div>
    </div>`;
  }
  // Show pending tiles that haven't started yet
  const nTiles = (tileInfo.length > 0 && tileInfo[0].status !== 'pending') ? 0 :
    tileInfo.filter(t => t.status === 'pending').length;
  html += '</div>';
  return html;
}

function renderTaskList() {
  const el = document.getElementById('taskList');
  let html = '<h3>Results</h3>';
  for (const [tid, t] of Object.entries(taskData)) {
    const active = tid === activeTaskId ? 'active' : '';
    const stats = t.stats || {};
    const status = t.status || 'unknown';
    html += `<div class="task-card ${active}" onclick="selectTask('${tid}')">
      <div class="name">${t.filename || tid}</div>
      <button class="delete-btn" onclick="event.stopPropagation();deleteTask('${tid}')" title="Delete">X</button>
      <div class="meta">
        <span class="badge ${status}">${status}</span>
        ${status === 'processing' && t.step_label ? `<span>${t.step_label}</span>` : ''}
        ${stats.n_trees != null ? `<span>${stats.n_trees} trees</span>` : ''}
        ${stats.inference_time_s ? `<span>${stats.inference_time_s}s</span>` : ''}
        ${status === 'completed' || status === 'failed' ? `<button class="btn-log" onclick="event.stopPropagation();viewLog('${tid}')">View Log</button>` : ''}
      </div>
      ${status === 'completed' ? `<div class="task-stats">
        <div>Points: <span class="val">${(stats.n_processed||0).toLocaleString()}</span></div>
        <div>Trees: <span class="val">${stats.n_trees||0}</span></div>
        ${stats.semantic ? `
        <div>Ground: <span class="val">${(stats.semantic.ground||0).toLocaleString()}</span></div>
        <div>Leaf: <span class="val">${(stats.semantic.leaf||0).toLocaleString()}</span></div>` : ''}
      </div>` : ''}
      ${status === 'processing' && t.tile_info ? renderTileGrid(t.tile_info) : ''}
    </div>`;
  }
  el.innerHTML = html;
}

async function selectTask(tid) {
  activeTaskId = tid;
  renderTaskList();
  clearTileMeshes();  // Clear progressive tiles before loading final result

  const t = taskData[tid];
  if (!t || t.status !== 'completed') return;

  // Show download links
  const dl = document.getElementById('downloads');
  dl.style.display = 'block';
  document.getElementById('dlPly').href = `${API}/result/${tid}/ply`;
  document.getElementById('dlJson').href = `${API}/result/${tid}/json`;

  // Update info bar
  const stats = t.stats || {};
  document.getElementById('infoTrees').textContent = `${stats.n_trees||0} trees detected`;
  document.getElementById('infoPoints').textContent = `${(stats.n_processed||0).toLocaleString()} points`;
  document.getElementById('infoTime').textContent = `${stats.inference_time_s||'?'}s inference`;

  // Load streaming viewer (octree tiles) or fallback to PLY
  try {
    const metaResp = await fetch(`${API}/viewer/${tid}/metadata.json`);
    if (metaResp.ok) {
      const meta = await metaResp.json();
      loadStreamingViewer(tid, meta);
    } else {
      // Fallback: load PLY text (small files only)
      const resp = await fetch(`${API}/result/${tid}/ply`);
      const text = await resp.text();
      loadPlyInViewer(text);
    }
  } catch(e) {
    console.error('Failed to load viewer:', e);
  }
}

// ==================== 3D VIEWER ====================
function initViewer() {
  const canvas = document.getElementById('viewer3d');
  const panel = document.getElementById('viewerPanel');

  renderer = new THREE.WebGLRenderer({canvas:canvas, antialias:true});
  renderer.setPixelRatio(window.devicePixelRatio);

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x161b22);

  camera = new THREE.PerspectiveCamera(55, 1, 0.01, 10000);
  camera.up.set(0,0,1);

  // Mouse controls on panel
  panel.addEventListener('mousedown', e => {
    if(e.button===0) isDrag=true; if(e.button===2) isPan=true;
    lx=e.clientX; ly=e.clientY; e.preventDefault();
  });
  document.addEventListener('mousemove', e => {
    var dx=e.clientX-lx, dy=e.clientY-ly; lx=e.clientX; ly=e.clientY;
    if(isDrag){
      spherical.theta-=dx*0.005; spherical.phi-=dy*0.005;
      spherical.phi=Math.max(0.05,Math.min(Math.PI-0.05,spherical.phi));
      updateCam();
    }
    if(isPan){
      var right=new THREE.Vector3(), up=new THREE.Vector3();
      right.crossVectors(camera.getWorldDirection(new THREE.Vector3()),camera.up).normalize();
      up.copy(camera.up).normalize();
      var ps=spherical.radius*0.002;
      camTarget.add(right.multiplyScalar(-dx*ps));
      camTarget.add(up.multiplyScalar(dy*ps));
      updateCam();
    }
  });
  document.addEventListener('mouseup', ()=>{isDrag=false;isPan=false;});
  panel.addEventListener('wheel', e => {
    spherical.radius*=(1+e.deltaY*0.001);
    spherical.radius=Math.max(R*0.2,Math.min(R*20,spherical.radius));
    updateCam(); e.preventDefault();
  }, {passive:false});
  panel.addEventListener('contextmenu', e=>e.preventDefault());

  // Toolbar
  document.getElementById('vPsize').oninput = function(){
    const v = this.value / 30.0;
    if(pointsMat) pointsMat.size = R*0.01*v;
    // Also update streaming nodes
    for (const obj of Object.values(streamNodes)) {
      obj.material.size = Math.max(1.0, R * 0.02) * v;
    }
  };
  document.getElementById('vBg').onchange = function(){
    scene.background = new THREE.Color(this.value);
  };
  document.getElementById('vColorMode').onchange = function(){
    if(currentPlyData) recolorPoints(this.value);
  };

  onResize();
  window.addEventListener('resize', onResize);
  animate();
}

function onResize() {
  const panel = document.getElementById('viewerPanel');
  const w = panel.clientWidth, h = panel.clientHeight;
  if(w<1||h<1) return;
  camera.aspect = w/h; camera.updateProjectionMatrix();
  renderer.setSize(w, h, false);
}

function updateCam() {
  var sp=Math.sin(spherical.phi),cp=Math.cos(spherical.phi);
  var st=Math.sin(spherical.theta),ct=Math.cos(spherical.theta);
  camera.position.set(
    camTarget.x+spherical.radius*sp*ct,
    camTarget.y+spherical.radius*sp*st,
    camTarget.z+spherical.radius*cp);
  camera.lookAt(camTarget);
}

let _lastStreamLOD = 0;
function animate(t) {
  requestAnimationFrame(animate);
  // Update streaming LOD every 150ms
  if (streamMeta && t - _lastStreamLOD > 150) {
    updateStreamLOD();
    _lastStreamLOD = t;
  }
  renderer.render(scene, camera);
}

function loadPlyInViewer(plyText) {
  // Parse PLY ASCII
  const lines = plyText.split('\n');
  let fields=[], nVerts=0, headerEnd=0;
  for(let i=0;i<lines.length;i++){
    const l=lines[i].trim();
    if(l.startsWith('element vertex')) nVerts=parseInt(l.split(' ').pop());
    if(l.startsWith('property')) fields.push(l.split(' ').pop());
    if(l==='end_header'){headerEnd=i+1;break;}
  }
  const col={};
  fields.forEach((f,i)=>col[f]=i);

  const pos=new Float32Array(nVerts*3);
  const colors=new Float32Array(nVerts*3);
  const plyRows = [];

  let cx=0,cy=0,cz=0;
  for(let i=0;i<nVerts;i++){
    const vals=lines[headerEnd+i].trim().split(/\s+/);
    const x=parseFloat(vals[col.x]), y=parseFloat(vals[col.y]), z=parseFloat(vals[col.z]);
    pos[i*3]=x; pos[i*3+1]=y; pos[i*3+2]=z;
    cx+=x; cy+=y; cz+=z;
    plyRows.push(vals);
  }
  cx/=nVerts; cy/=nVerts; cz/=nVerts;
  R=0;
  for(let i=0;i<nVerts;i++){
    pos[i*3]-=cx; pos[i*3+1]-=cy; pos[i*3+2]-=cz;
    const dx=pos[i*3],dy=pos[i*3+1],dz=pos[i*3+2];
    R=Math.max(R,Math.sqrt(dx*dx+dy*dy+dz*dz));
  }

  currentPlyData = {pos, plyRows, col, nVerts};

  // Color by instance
  colorPoints(plyRows, col, colors, 'instance');

  // Remove old
  if(pointsMesh) scene.remove(pointsMesh);

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(colors,3));

  pointsMat = new THREE.PointsMaterial({
    size: R*0.01, vertexColors:true, sizeAttenuation:true
  });
  pointsMesh = new THREE.Points(geo, pointsMat);
  scene.add(pointsMesh);

  // Reset camera
  spherical.radius = R*2.8;
  spherical.theta = -Math.PI/2;
  spherical.phi = Math.PI/3;
  camTarget.set(0,0,0);
  updateCam();

  // Show viewer
  document.getElementById('viewerEmpty').style.display='none';
  document.getElementById('viewer3d').style.display='block';
  document.getElementById('viewerToolbar').style.display='block';
  document.getElementById('infoBar').style.display='flex';
  document.getElementById('vPsize').value=30;
  onResize();
}

function colorPoints(rows, col, colors, mode) {
  for(let i=0;i<rows.length;i++){
    let c;
    if(mode==='instance'){
      const inst=parseInt(rows[i][col.instance_pred]||'-1');
      c = inst>=0 ? INST_COLORS[inst%INST_COLORS.length] : UNASSIGNED;
    } else {
      const sem=parseInt(rows[i][col.semantic_pred]||'0');
      c = SEM_COLORS[sem]||UNASSIGNED;
    }
    colors[i*3]=c[0]/255; colors[i*3+1]=c[1]/255; colors[i*3+2]=c[2]/255;
  }
}

function recolorPoints(mode) {
  if(!currentPlyData) return;
  const {plyRows, col, nVerts} = currentPlyData;
  const colors = new Float32Array(nVerts*3);
  colorPoints(plyRows, col, colors, mode);
  pointsMesh.geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors,3));
  pointsMesh.geometry.attributes.color.needsUpdate = true;
}

// ==================== STREAMING OCTREE VIEWER ====================
let streamNodes = {};      // key -> THREE.Points
let streamLoading = new Set();
let streamMeta = null;
let streamTaskId = null;
let streamVisiblePts = 0;
const STREAM_POINT_SIZE = 16; // bytes per point in .bin tiles
const STREAM_MAX_CONCURRENT = 8;
const STREAM_SCREEN_THRESHOLD = 60;

function clearStreamViewer() {
  for (const key of Object.keys(streamNodes)) {
    scene.remove(streamNodes[key]);
    streamNodes[key].geometry.dispose();
    streamNodes[key].material.dispose();
  }
  streamNodes = {};
  streamLoading.clear();
  streamMeta = null;
  streamTaskId = null;
  streamVisiblePts = 0;
}

function loadStreamingViewer(taskId, meta) {
  clearStreamViewer();
  if (pointsMesh) { scene.remove(pointsMesh); pointsMesh = null; }

  streamMeta = meta;
  streamTaskId = taskId;

  const bMin = meta.bbox_min;
  const bSize = meta.bbox_size;
  const cx = bMin[0] + bSize/2, cy = bMin[1] + bSize/2, cz = bMin[2] + bSize/2;
  R = bSize / 2;

  // Reset camera to scene center
  camTarget.set(cx, cy, cz);
  spherical.radius = R * 2.5;
  spherical.theta = -Math.PI/2;
  spherical.phi = Math.PI/3;
  updateCam();

  // Show viewer
  document.getElementById('viewerEmpty').style.display='none';
  document.getElementById('viewer3d').style.display='block';
  document.getElementById('viewerToolbar').style.display='block';
  document.getElementById('infoBar').style.display='flex';
  document.getElementById('vPsize').value=30;
  onResize();

  console.log('Streaming viewer loaded:', meta.total_points, 'points,', Object.keys(meta.nodes).length, 'nodes');
}

function getStreamNodeBBox(key) {
  const bMin = streamMeta.bbox_min;
  let min = [bMin[0], bMin[1], bMin[2]];
  let size = streamMeta.bbox_size;
  for (let i = 1; i < key.length; i++) {
    size /= 2;
    const c = parseInt(key[i]);
    min[0] += (c & 1) ? size : 0;
    min[1] += (c & 2) ? size : 0;
    min[2] += (c & 4) ? size : 0;
  }
  return {min, size};
}

function streamNodeScreenSize(key) {
  const bb = getStreamNodeBBox(key);
  const nc = new THREE.Vector3(bb.min[0]+bb.size/2, bb.min[1]+bb.size/2, bb.min[2]+bb.size/2);
  const dist = camera.position.distanceTo(nc);
  if (dist < 0.001) return 99999;
  const fov = camera.fov * Math.PI / 180;
  return (bb.size / dist) * renderer.domElement.height / (2 * Math.tan(fov/2));
}

async function loadStreamNode(key) {
  if (streamNodes[key] || streamLoading.has(key)) return;
  if (!streamMeta.nodes[key]) return;
  streamLoading.add(key);

  try {
    const resp = await fetch(`${API}/viewer/${streamTaskId}/tiles/${key}.bin`);
    if (!resp.ok) { streamLoading.delete(key); return; }
    const buf = await resp.arrayBuffer();
    const arr = new Uint8Array(buf);
    const n = arr.length / STREAM_POINT_SIZE;
    if (n === 0) { streamLoading.delete(key); return; }

    const dv = new DataView(buf);
    const positions = new Float32Array(n * 3);
    const colors = new Float32Array(n * 3);

    for (let i = 0; i < n; i++) {
      const o = i * STREAM_POINT_SIZE;
      positions[i*3]   = dv.getFloat32(o, true);
      positions[i*3+1] = dv.getFloat32(o+4, true);
      positions[i*3+2] = dv.getFloat32(o+8, true);
      colors[i*3]   = arr[o+12] / 255;
      colors[i*3+1] = arr[o+13] / 255;
      colors[i*3+2] = arr[o+14] / 255;
    }

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
    const mat = new THREE.PointsMaterial({
      size: Math.max(1.0, R * 0.02),
      vertexColors: true, sizeAttenuation: true
    });
    const points = new THREE.Points(geo, mat);
    points.userData = {key, count: n};
    scene.add(points);
    streamNodes[key] = points;
    streamVisiblePts += n;
  } catch(e) {
    console.warn('Failed to load tile', key, e);
  }
  streamLoading.delete(key);
}

function unloadStreamNode(key) {
  const obj = streamNodes[key];
  if (!obj) return;
  streamVisiblePts -= obj.userData.count;
  scene.remove(obj);
  obj.geometry.dispose();
  obj.material.dispose();
  delete streamNodes[key];
}

function updateStreamLOD() {
  if (!streamMeta) return;
  const nodes = streamMeta.nodes;
  const toLoad = [];
  const toKeep = new Set();

  // BFS from root
  const queue = ['r'];
  while (queue.length > 0) {
    const key = queue.shift();
    if (!nodes[key]) continue;

    const ss = streamNodeScreenSize(key);
    const nodeInfo = nodes[key];

    if (ss > STREAM_SCREEN_THRESHOLD && nodeInfo.children && nodeInfo.children.length > 0) {
      for (const c of nodeInfo.children) queue.push(key + c);
      toKeep.add(key);
    } else {
      toKeep.add(key);
    }
  }

  // Load needed
  for (const key of toKeep) {
    if (!streamNodes[key] && !streamLoading.has(key)) toLoad.push(key);
  }

  // Unload unneeded
  for (const key of Object.keys(streamNodes)) {
    if (!toKeep.has(key)) {
      let needed = false;
      for (const k of toKeep) { if (k.startsWith(key)) { needed = true; break; } }
      if (!needed) unloadStreamNode(key);
    }
  }

  // Load with priority (largest screen size first)
  toLoad.sort((a, b) => streamNodeScreenSize(b) - streamNodeScreenSize(a));
  const budget = STREAM_MAX_CONCURRENT - streamLoading.size;
  for (let i = 0; i < Math.min(budget, toLoad.length); i++) loadStreamNode(toLoad[i]);

  // Update info bar
  const loaded = Object.keys(streamNodes).length;
  const total = Object.keys(nodes).length;
  document.getElementById('infoPoints').textContent =
    streamVisiblePts.toLocaleString() + ' / ' + streamMeta.total_points.toLocaleString() + ' points';
}

// ==================== MODEL MANAGEMENT ====================
async function loadModels() {
  try {
    const resp = await fetch(`${API}/models`);
    const models = await resp.json();
    const sel = document.getElementById('modelSelect');
    if (!models.length) {
      sel.innerHTML = '<option value="">No models found</option>';
      document.getElementById('modelMeta').textContent = '';
      return;
    }
    sel.innerHTML = '';
    let currentModel = null;
    for (const m of models) {
      const opt = document.createElement('option');
      opt.value = m.path;
      const sizeMB = (m.size / 1048576).toFixed(1);
      opt.textContent = `${m.filename} (${sizeMB} MB)`;
      if (m.current) {
        opt.selected = true;
        currentModel = m;
      }
      sel.appendChild(opt);
    }
    updateModelMeta();
    sel.addEventListener('change', updateModelMeta);
  } catch (e) {
    document.getElementById('modelSelect').innerHTML = '<option value="">Failed to load</option>';
  }
}

function updateModelMeta() {
  const sel = document.getElementById('modelSelect');
  const path = sel.value;
  document.getElementById('modelMeta').textContent = path ? path : '';
}

async function switchModel() {
  const sel = document.getElementById('modelSelect');
  const path = sel.value;
  if (!path) return;
  try {
    const resp = await fetch(`${API}/config/model`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({path: path}),
    });
    const data = await resp.json();
    if (resp.ok) {
      document.getElementById('modelMeta').textContent = 'Switched: ' + path;
      // Reload models to update current marker
      loadModels();
    } else {
      alert('Failed to switch model: ' + (data.detail || JSON.stringify(data)));
    }
  } catch (e) {
    alert('Failed to switch model: ' + e.message);
  }
}

// ==================== DATA BROWSER ====================
async function refreshData() {
  try {
    const resp = await fetch(`${API}/data`);
    const files = await resp.json();
    const panel = document.getElementById('dataPanel');

    if (!files.length) {
      panel.innerHTML = '<div class="files-empty">No LiDAR data files found on server</div>';
      return;
    }

    let html = '';
    for (const f of files) {
      const sizeMB = (f.size / 1048576).toFixed(1);
      const typeLabel = f.type.toUpperCase();
      html += `<div class="data-item">
        <div class="data-icon">&#x1F4E1;</div>
        <div class="data-info">
          <div class="data-name" title="${f.path}">${f.filename}</div>
          <div class="data-meta">${sizeMB} MB &middot; ${typeLabel} &middot; ${formatTime(f.modified)}</div>
        </div>
        <button class="btn-run" data-path="${f.path.replace(/"/g, '&quot;')}" onclick="runDataInference(this.dataset.path)">Run</button>
      </div>`;
    }
    panel.innerHTML = html;
  } catch (e) {
    console.error('Failed to load data files:', e);

  }

async function runDataInference(dataPath) {
  const sub = document.getElementById('paramSubsample').value;
  const tileSize = document.getElementById('paramTileSize').value;

  // Show progress
  progressContainer.classList.add('show');
  progressLabel.textContent = 'Starting...';
  progressElapsed.textContent = '0.0s';
  document.getElementById('progressStages').innerHTML = '';
  document.getElementById('progressDetail').style.display = 'none';
  uploadBtn.disabled = true;

  try {
    const resp = await fetch(`${API}/predict/data`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({data_path: dataPath, subsample: parseFloat(sub), tile_size: parseFloat(tileSize)}),
    });
    const data = await resp.json();

    if (resp.ok) {
      const taskId = data.task_id;
      taskData[taskId] = {
        task_id: taskId,
        status: 'processing',
        filename: data.filename || dataPath.split('/').pop(),
        step: 'reading',
        step_label: 'Reading point cloud',
        progress: 10,
      };
      progressContainer.dataset.taskId = taskId;
      switchTab('results');
      renderTaskList();
      startPolling(taskId);
    } else {
      progressContainer.classList.remove('show');
      uploadBtn.disabled = false;
      alert('Error: ' + (data.detail || JSON.stringify(data)));
    }
  } catch (e) {
    progressContainer.classList.remove('show');
    uploadBtn.disabled = false;
    alert('Request failed: ' + e.message);
  }
}

// ==================== HEALTH CHECK ====================
function hasActiveTasks() {
  return Object.keys(pollingTimers).length > 0;
}

async function checkHealth() {
  // Use longer timeout when tasks are running (server is busy with inference)
  const timeout = hasActiveTasks() ? 30000 : 5000;
  try {
    const resp = await fetch(`${API}/health`, {signal: AbortSignal.timeout(timeout)});
    const data = await resp.json();
    document.getElementById('statusDot').className = 'dot on';
    document.getElementById('statusText').textContent =
      `GPU Ready${data.model_loaded ? ' · Model Loaded' : ''}`;
    updateHardwarePanel(data);
  } catch(e) {
    if (hasActiveTasks()) {
      // Server is busy processing — not offline
      document.getElementById('statusDot').className = 'dot busy';
      document.getElementById('statusText').textContent = 'Processing (server busy)';
      document.getElementById('hwContent').innerHTML =
        '<div style="color:var(--orange)">Server busy — inference running</div>';
    } else {
      document.getElementById('statusDot').className = 'dot off';
      document.getElementById('statusText').textContent = 'Server Offline';
      document.getElementById('hwContent').textContent = 'Server offline';
    }
  }
}

function barColor(pct) {
  return pct > 85 ? 'red' : pct > 50 ? 'orange' : 'green';
}

function utilBar(label, pct, detail) {
  const p = Math.min(100, Math.max(0, pct || 0));
  return `<div class="hw-bar-row"><span class="hw-label">${label}</span><span class="hw-val">${detail || p.toFixed(0)+'%'}</span></div>` +
    `<div class="hw-bar"><div class="hw-bar-fill ${barColor(p)}" style="width:${p}%"></div></div>`;
}

function updateHardwarePanel(data) {
  const el = document.getElementById('hwContent');
  let html = '';
  const row = (label, val) => `<div class="hw-row"><span class="hw-label">${label}</span><span class="hw-val">${val}</span></div>`;

  if (data.gpu_available && data.gpu) {
    const g = data.gpu;
    html += `<div class="hw-gpu">${g.name}</div>`;
    html += row('CUDA', g.cuda_version + ' · ×' + g.count);

    // GPU utilization bars
    html += '<div class="hw-section"><div class="hw-section-title">Utilization</div>';
    if (g.utilization_pct != null) {
      html += utilBar('GPU', g.utilization_pct);
    }
    const vramPct = g.memory_used_pct || (g.memory_reserved_gb / g.memory_total_gb * 100);
    const vramDetail = (g.memory_reserved_gb || 0).toFixed(1) + ' / ' + g.memory_total_gb + ' GB';
    html += utilBar('VRAM', vramPct, vramDetail);
    if (g.temperature_c != null) {
      html += row('Temp', g.temperature_c + ' °C');
    }
    if (g.power_w != null) {
      html += row('Power', g.power_w.toFixed(0) + ' / ' + g.power_limit_w.toFixed(0) + ' W');
    }
    html += '</div>';
  } else {
    html += '<div class="hw-nogpu">No GPU</div>';
  }

  if (data.system) {
    const s = data.system;
    html += '<div class="hw-section"><div class="hw-section-title">System</div>';
    if (s.cpu_used_pct != null) {
      html += utilBar('CPU', s.cpu_used_pct, s.cpu_used_pct.toFixed(0) + '% · ' + s.cpu_count + ' cores');
    } else {
      html += row('CPU', s.cpu_count + ' cores');
    }
    if (s.ram_total_gb) {
      const ramPct = s.ram_used_pct || (s.ram_used_gb / s.ram_total_gb * 100);
      html += utilBar('RAM', ramPct, (s.ram_used_gb||0).toFixed(1) + ' / ' + s.ram_total_gb + ' GB');
    }
    html += '</div>';
  }

  if (data.checkpoint) {
    html += '<div class="hw-section">';
    html += row('Model', data.checkpoint.filename);
    html += row('Size', data.checkpoint.size_mb + ' MB');
    html += row('Status', data.model_loaded
      ? '<span style="color:var(--green)">Loaded</span>'
      : '<span style="color:var(--orange)">Idle</span>');
    html += '</div>';
  }

  el.innerHTML = html;
}

// Update hardware panel from lightweight task poll data (works even when /health is slow)
function updateHardwareFromPoll(hw) {
  const el = document.getElementById('hwContent');
  const row = (label, val) => `<div class="hw-row"><span class="hw-label">${label}</span><span class="hw-val">${val}</span></div>`;
  let html = '<div class="hw-section-title" style="color:var(--orange)">Live · Inference Running</div>';

  if (hw.gpu_util_pct != null) {
    html += utilBar('GPU', hw.gpu_util_pct);
  }
  if (hw.vram_total_gb) {
    const vramPct = (hw.vram_reserved_gb / hw.vram_total_gb * 100);
    html += utilBar('VRAM', vramPct, hw.vram_reserved_gb.toFixed(1) + ' / ' + hw.vram_total_gb + ' GB');
  }
  if (hw.temp_c != null) {
    html += row('Temp', hw.temp_c + ' °C');
  }
  if (hw.cpu_used_pct != null) {
    html += utilBar('CPU', hw.cpu_used_pct);
  }
  if (hw.ram_used_pct != null) {
    html += utilBar('RAM', hw.ram_used_pct);
  }

  el.innerHTML = html;
  // Also set status to busy
  document.getElementById('statusDot').className = 'dot busy';
}

// ==================== PROGRESSIVE TILE RENDERING ====================
function clearTileMeshes() {
  for (const m of tileMeshes) {
    scene.remove(m);
    m.geometry.dispose();
    m.material.dispose();
  }
  tileMeshes = [];
}

async function loadTilePreview(taskId, tileIdx) {
  try {
    const resp = await fetch(`${API}/task/${taskId}/tile/${tileIdx}`);
    if (!resp.ok) return;
    const text = await resp.text();

    // Parse PLY
    const lines = text.split('\n');
    let headerEnd = 0, nVerts = 0;
    const col = {};
    let fieldIdx = 0;
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i].trim();
      if (line.startsWith('element vertex')) nVerts = parseInt(line.split(' ')[2]);
      if (line.startsWith('property')) {
        const name = line.split(' ').pop();
        col[name] = fieldIdx++;
      }
      if (line === 'end_header') { headerEnd = i + 1; break; }
    }
    if (nVerts === 0) return;

    const pos = new Float32Array(nVerts * 3);
    const colors = new Float32Array(nVerts * 3);
    let cx = 0, cy = 0, cz = 0;

    for (let i = 0; i < nVerts; i++) {
      const vals = lines[headerEnd + i].trim().split(/\s+/);
      const x = parseFloat(vals[col.x]), y = parseFloat(vals[col.y]), z = parseFloat(vals[col.z]);
      pos[i*3] = x; pos[i*3+1] = y; pos[i*3+2] = z;
      cx += x; cy += y; cz += z;

      // Color by instance
      const inst = col.instance_pred != null ? parseInt(vals[col.instance_pred] || '-1') : -1;
      const c = inst >= 0 ? INST_COLORS[inst % INST_COLORS.length] : UNASSIGNED;
      colors[i*3] = c[0]/255; colors[i*3+1] = c[1]/255; colors[i*3+2] = c[2]/255;
    }

    // First tile: initialize viewer and set camera
    if (tileMeshes.length === 0) {
      // Show viewer
      document.getElementById('viewerEmpty').style.display = 'none';
      document.getElementById('viewer3d').style.display = 'block';
      document.getElementById('viewerToolbar').style.display = 'block';
      if (pointsMesh) { scene.remove(pointsMesh); pointsMesh = null; }

      // Set center from first tile
      cx /= nVerts; cy /= nVerts; cz /= nVerts;
      camTarget.set(cx, cy, cz);
      R = 50; // reasonable initial radius for tiled data
      spherical.radius = R * 2.8;
      spherical.theta = -Math.PI/2;
      spherical.phi = Math.PI/3;
      updateCam();
      onResize();
    }

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
    const mat = new THREE.PointsMaterial({
      size: 0.3, vertexColors: true, sizeAttenuation: true
    });
    const mesh = new THREE.Points(geo, mat);
    scene.add(mesh);
    tileMeshes.push(mesh);

    // Update info bar
    const totalPts = tileMeshes.reduce((s, m) => s + m.geometry.attributes.position.count, 0);
    document.getElementById('infoPoints').textContent = `${totalPts.toLocaleString()} pts (${tileMeshes.length} tiles)`;
    document.getElementById('infoBar').style.display = 'flex';

  } catch (e) {
    console.warn(`Failed to load tile ${tileIdx}:`, e);
  }
}
